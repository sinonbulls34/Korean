<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="面向台灣初學者的韓語自學網站，從韓文 40 音、發音規則、拼字到生活與旅行常用詞。"
    />
    <title>初學韓語 | 40 音自學網站</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要內容</a>

    <header class="topbar">
      <a class="brand" href="#learn" aria-label="初學韓語首頁">
        <span class="brand-mark">ㅎ</span>
        <span>
          <strong>初學韓語</strong>
          <small>Hangul Starter</small>
        </span>
      </a>

      <nav class="main-tabs" aria-label="主要分頁">
        <button class="main-tab is-active" type="button" data-main-tab="learn">學習</button>
        <button class="main-tab" type="button" data-main-tab="practice">練習</button>
      </nav>

      <div class="progress-pill" aria-live="polite">
        <span>40 音進度</span>
        <strong id="progress-value">0%</strong>
      </div>
    </header>

    <main id="main-content">
      <section class="intro-section" aria-labelledby="site-title">
        <div class="intro-copy">
          <p class="eyebrow">給從零開始的台灣學習者</p>
          <h1 id="site-title">先會讀，再開始說。</h1>
          <p>
            韓文是拼音文字。先掌握母音嘴型，再學子音、收音與拼字規則，
            就能把陌生的韓文字拆成可以練習的聲音。
          </p>

          <div class="learning-track" aria-label="學習順序">
            <span>基本母音</span>
            <span>複合母音</span>
            <span>單子音</span>
            <span>雙子音</span>
            <span>拼字</span>
            <span>常用詞</span>
          </div>
        </div>

        <div class="sound-lab" aria-label="韓文拼字示意">
          <div class="letter-orbit" aria-hidden="true">
            <span>ㄱ</span>
            <span>ㅏ</span>
            <span>ㅇ</span>
            <span>ㅎ</span>
          </div>
          <div class="syllable-demo">
            <span class="demo-part">ㅎ</span>
            <span class="demo-part">ㅏ</span>
            <strong>하</strong>
          </div>
          <p>子音 + 母音 = 一個音節方塊</p>
        </div>
      </section>

      <section class="tab-panel is-active" id="learn-panel" data-panel="learn" aria-label="學習">
        <div class="workspace">
          <aside class="side-menu" aria-label="學習內容選單">
            <button class="side-item is-active" type="button" data-learn-section="sounds">40 音</button>
            <button class="side-item" type="button" data-learn-section="rules">發音規則</button>
            <button class="side-item" type="button" data-learn-section="spelling">拼字</button>
            <button class="side-item" type="button" data-learn-section="daily">生活常用詞語</button>
            <button class="side-item" type="button" data-learn-section="travel">旅行常用詞語</button>
          </aside>

          <article class="content-area" id="learn-content" aria-live="polite"></article>
        </div>
      </section>

      <section class="tab-panel" id="practice-panel" data-panel="practice" aria-label="練習">
        <div class="workspace">
          <aside class="side-menu" aria-label="練習項目選單">
            <button class="side-item is-active" type="button" data-practice-type="sound-letter">聽音選字</button>
            <button class="side-item" type="button" data-practice-type="sound-word">聽音選詞</button>
            <button class="side-item" type="button" data-practice-type="meaning-word">中文選韓文</button>
          </aside>

          <article class="content-area" id="practice-content" aria-live="polite"></article>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
